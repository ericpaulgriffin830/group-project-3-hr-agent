name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Verify core libraries import
        run: >
          uv run python -c
          "import chromadb, langchain, langgraph, fastembed, rank_bm25;
          print('All core dependencies import successfully')"

      - name: MCP tool discovery and call smoke test
        run: uv run python scripts/ci_mcp_smoke_test.py

      - name: Run tests
        run: uv run python -m pytest -v

  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hr-agent-api deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger hr-agent-ui deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_UI }}"