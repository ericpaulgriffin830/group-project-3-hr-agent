[project]
name = "quantic-hr-ai-rag-group-project"
version = "0.1.0"
description = "Group project: AI RAG App for Human Resources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=1.7.0",
    "langchain>=1.4.2",
    "langgraph>=1.2.11",
    "mcp>=2.2.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
